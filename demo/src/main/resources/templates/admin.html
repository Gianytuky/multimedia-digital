<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin - MultiMedia Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- BARRA LATERAL -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow-1 p-4 overflow-auto" style="height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-0 text-dark"><i class="bi bi-speedometer2 text-danger me-2"></i>Panel Gerencial y Estadísticas</h2>
                <small class="text-muted">Supervisión estratégica de ingresos, métricas y mantenimientos.</small>
            </div>
            <span class="badge bg-danger fs-6 py-2 px-3"><i class="bi bi-shield-lock me-1"></i>Rol: Administrador</span>
        </div>

        <!-- TARJETAS DE MÉTRICAS -->
        <div class="row g-3 mb-4">
            <div class="col-md-3 col-6">
                <div class="card bg-primary text-white shadow-sm border-0 rounded-3 p-3">
                    <span class="text-uppercase small fw-bold opacity-75">Ingresos Totales</span>
                    <h3 class="fw-bold mb-0" th:text="'S/ ' + ${#numbers.formatDecimal(totalIngresos, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</h3>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card bg-success text-white shadow-sm border-0 rounded-3 p-3">
                    <span class="text-uppercase small fw-bold opacity-75">Total OTs</span>
                    <h3 class="fw-bold mb-0" th:text="${totalOTs} + ' OTs'">0 OTs</h3>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card bg-warning text-dark shadow-sm border-0 rounded-3 p-3">
                    <span class="text-uppercase small fw-bold opacity-75">Horas Totales</span>
                    <h3 class="fw-bold mb-0" th:text="${totalHoras} + ' Hrs'">0.0 Hrs</h3>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card bg-info text-dark shadow-sm border-0 rounded-3 p-3">
                    <span class="text-uppercase small fw-bold opacity-75">Volumen Datos</span>
                    <h3 class="fw-bold mb-0" th:text="${totalGB} + ' GB'">0.0 GB</h3>
                </div>
            </div>
        </div>

        <!-- GRÁFICOS DINÁMICOS -->
        <div class="row g-4 mb-5">
            <div class="col-lg-7 col-12">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="bi bi-bar-chart-line-fill me-2 text-warning"></i>Ingresos por Formato (Soles)
                    </div>
                    <div class="card-body p-3">
                        <canvas id="chartAdminIngresos" style="min-height: 250px;"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-5 col-12">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="bi bi-pie-chart-fill me-2 text-info"></i>Participación por Formato
                    </div>
                    <div class="card-body p-3">
                        <canvas id="chartAdminCircular" style="min-height: 250px;"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const etiquetas = /*[[${etiquetasIngresos}]]*/ [];
    const valores = /*[[${valoresIngresos}]]*/ [];
    const formatos = /*[[${formatos}]]*/ [];
    const cantidades = /*[[${cantidades}]]*/ [];

    new Chart(document.getElementById('chartAdminIngresos').getContext('2d'), {
        type: 'bar',
        data: {
            labels: etiquetas,
            datasets: [{ label: 'Soles (S/)', data: valores, backgroundColor: 'rgba(54, 162, 235, 0.7)' }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    new Chart(document.getElementById('chartAdminCircular').getContext('2d'), {
        type: 'pie',
        data: {
            labels: formatos,
            datasets: [{ data: cantidades, backgroundColor: ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0', '#9966ff'] }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
    /*]]>*/
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
