<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - MultiMedia Digital</title>
    <!-- Bootstrap CSS y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-11">

            <!-- ALERTAS DE ESTADO -->
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${logoutMsg}" class="alert alert-info alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-info-circle-fill me-2"></i>
                <span th:text="${logoutMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${denegadoMsg}" class="alert alert-warning alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-shield-exclamation me-2"></i>
                <span th:text="${denegadoMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- TARJETA DE LOGIN CON DISEÑO DEDICADO -->
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white text-center py-4 border-bottom border-warning">
                    <i class="bi bi-disc-fill text-warning fs-1 mb-2 d-block"></i>
                    <h3 class="fw-bold mb-0">MultiMedia Digital</h3>
                    <small class="text-muted">Portal de Acceso Único por Roles</small>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="txtCorreo" class="form-label fw-bold small">Correo Electrónico *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="txtCorreo" name="correo" placeholder="ejecutivo@tienda.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="txtPassword" class="form-label fw-bold small">Contraseña *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="txtPassword" name="password" placeholder="••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm fs-5">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al Sistema
                        </button>
                    </form>

                    <!-- ACCESOS RÁPIDOS DE PRUEBA -->
                    <div class="mt-4 pt-3 border-top text-center">
                        <span class="small text-muted d-block mb-2 fw-semibold">Seleccionar Rol de Prueba Rápido:</span>
                        <div class="d-flex flex-column gap-2">
                            <button type="button" onclick="cargarCredenciales('ejecutivo@tienda.com', '123')" class="btn btn-outline-warning btn-sm text-dark text-start">
                                <i class="bi bi-person-badge me-2 text-warning"></i><strong>Ejecutivo:</strong> ejecutivo@tienda.com
                            </button>
                            <button type="button" onclick="cargarCredenciales('tecnico@tienda.com', '123')" class="btn btn-outline-info btn-sm text-dark text-start">
                                <i class="bi bi-tools me-2 text-info"></i><strong>Técnico:</strong> tecnico@tienda.com
                            </button>
                            <button type="button" onclick="cargarCredenciales('admin@tienda.com', '123')" class="btn btn-outline-danger btn-sm text-dark text-start">
                                <i class="bi bi-shield-lock me-2 text-danger"></i><strong>Admin:</strong> admin@tienda.com
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card-footer bg-light text-center py-3">
                    <a th:href="@{/}" class="text-decoration-none text-muted small">
                        <i class="bi bi-arrow-left me-1"></i>Volver al Sitio Web Público
                    </a>
                </div>
            </div>

        </div>
    </div>
</main>

<script>
    function cargarCredenciales(correo, pass) {
        document.getElementById('txtCorreo').value = correo;
        document.getElementById('txtPassword').value = pass;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
