<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bandeja de Consultas - MultiMedia Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- BARRA LATERAL -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow-1 p-4 overflow-auto" style="height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-0 text-dark"><i class="bi bi-inbox-fill text-primary me-2"></i>Bandeja de Consultas Recibidas</h2>
                <small class="text-muted">Mensajes enviados desde la página web de contacto.</small>
            </div>
            <a th:href="@{/consultas}" class="btn btn-outline-primary btn-sm fw-bold"><i class="bi bi-arrow-clockwise me-1"></i>Actualizar</a>
        </div>

        <!-- FILTRO DE FECHAS -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-3">
                <form th:action="@{/consultas}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-4 col-12">
                        <label class="form-label small fw-bold mb-1">Fecha Desde:</label>
                        <input type="date" name="fechaInicio" class="form-control form-control-sm" th:value="${fechaInicio}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small fw-bold mb-1">Fecha Hasta:</label>
                        <input type="date" name="fechaFin" class="form-control form-control-sm" th:value="${fechaFin}">
                    </div>
                    <div class="col-md-4 col-12 d-flex align-items-end gap-2 pt-3 pt-md-0">
                        <button type="submit" class="btn btn-primary btn-sm fw-bold flex-grow-1"><i class="bi bi-funnel me-1"></i> Filtrar</button>
                        <a th:if="${fechaInicio != null or fechaFin != null}" th:href="@{/consultas}" class="btn btn-secondary btn-sm fw-bold">Quitar Filtro</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- TABLA RESULTADOS -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                <span><i class="bi bi-list-stars me-2"></i>Mensajes Recibidos</span>
                <span class="badge bg-primary fs-6" th:text="${mensajes.size()} + ' mensajes'"></span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0 text-center">
                        <thead class="table-dark small">
                            <tr>
                                <th>Código</th>
                                <th>Fecha / Hora</th>
                                <th>Remitente</th>
                                <th>Contacto</th>
                                <th class="text-start">Extracto</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${mensajes}">
                                <td class="fw-bold text-primary" th:text="${m.codigo}"></td>
                                <td class="small text-muted" th:text="${#temporals.format(m.fechaEnvio, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="fw-semibold text-start" th:text="${m.nombre}"></td>
                                <td class="small text-start">
                                    <div th:text="${m.email}"></div>
                                    <div class="text-muted" th:text="${m.telefono}"></div>
                                </td>
                                <td class="small text-start text-truncate" style="max-width: 250px;" th:text="${m.mensaje}"></td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <button type="button" class="btn btn-outline-info" data-bs-toggle="modal" th:data-bs-target="'#modalDetalle_' + ${m.codigo}"><i class="bi bi-eye-fill me-1"></i>Ver Detalle</button>
                                        <a th:href="@{/consultas/eliminar/{codigo}(codigo=${m.codigo})}" class="btn btn-outline-danger" onclick="return confirm('¿Eliminar mensaje?');"><i class="bi bi-trash"></i></a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${mensajes.isEmpty()}">
                                <td colspan="6" class="text-muted py-5">No se encontraron mensajes.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- MODALES DE DETALLE -->
        <div th:each="m : ${mensajes}">
            <div class="modal fade" th:id="'modalDetalle_' + ${m.codigo}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content border-0 shadow-lg rounded-3">
                        <div class="modal-header bg-primary text-white">
                            <h5 class="modal-title fw-bold"><i class="bi bi-envelope-open-fill me-2"></i>Consulta <span th:text="${m.codigo}"></span></h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body p-4">
                            <div class="row g-3 p-3 bg-light rounded border mb-3">
                                <div class="col-md-6"><small class="text-muted d-block fw-bold">Remitente:</small><span class="fs-6 fw-bold" th:text="${m.nombre}"></span></div>
                                <div class="col-md-6 text-md-end"><small class="text-muted d-block fw-bold">Correo:</small><a th:href="'mailto:' + ${m.email}" th:text="${m.email}"></a></div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label fw-bold">Mensaje Completo:</label>
                                <div class="p-3 bg-white rounded border text-secondary" style="white-space: pre-wrap;" th:text="${m.mensaje}"></div>
                            </div>
                        </div>
                        <div class="modal-footer bg-light">
                            <a th:href="'mailto:' + ${m.email} + '?subject=Respuesta a Consulta ' + ${m.codigo}" class="btn btn-primary fw-bold btn-sm"><i class="bi bi-reply-fill me-1"></i>Responder</a>
                            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
