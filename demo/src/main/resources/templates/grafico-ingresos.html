<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Ingresos - MultiMedia Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- BARRA LATERAL DEDICADA -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- CONTENIDO DEL REPORTE -->
    <main class="flex-grow-1 p-4 overflow-auto" style="height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-0 text-dark"><i class="bi bi-bar-chart-line-fill text-warning me-2"></i>Reporte Estadístico de Ingresos</h2>
                <small class="text-muted">Análisis detallado en barras y tendencia lineal.</small>
            </div>
            <a th:href="@{/dashboard/distribucion}" class="btn btn-outline-info btn-sm fw-bold">
                <i class="bi bi-pie-chart-fill me-1"></i>Ver Distribución de Formatos
            </a>
        </div>

        <div class="row g-4 mb-4">
            <!-- GRÁFICO 1: BARRAS -->
            <div class="col-lg-6 col-12">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-bar-chart-fill me-2 text-warning"></i>Ingresos (S/) por Formato</span>
                        <span class="badge bg-primary">Bar Chart</span>
                    </div>
                    <div class="card-body p-3">
                        <canvas id="graficoBarrasIngresos" style="min-height: 280px;"></canvas>
                    </div>
                </div>
            </div>

            <!-- GRÁFICO 2: LINEAL -->
            <div class="col-lg-6 col-12">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-graph-up me-2 text-success"></i>Tendencia de Ingresos</span>
                        <span class="badge bg-success">Line Chart</span>
                    </div>
                    <div class="card-body p-3">
                        <canvas id="graficoLinealIngresos" style="min-height: 280px;"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA DETALLE NUMÉRICO -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-secondary text-white fw-bold">
                <i class="bi bi-table me-2"></i>Detalle Numérico de la Muestra
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-hover mb-0 text-center">
                        <thead class="table-light">
                            <tr>
                                <th>Formato</th>
                                <th>Monto Total Estimado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="etiqueta, iterStat : ${etiquetas}">
                                <td class="fw-bold" th:text="${etiqueta}"></td>
                                <td class="text-success fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(valores[iterStat.index], 1, 'COMMA', 2, 'POINT')}"></td>
                            </tr>
                            <tr th:if="${etiquetas.isEmpty()}">
                                <td colspan="2" class="text-muted py-3">No hay datos suficientes para graficar.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const etiquetas = /*[[${etiquetas}]]*/ [];
    const valores = /*[[${valores}]]*/ [];

    new Chart(document.getElementById('graficoBarrasIngresos').getContext('2d'), {
        type: 'bar',
        data: {
            labels: etiquetas,
            datasets: [{
                label: 'Ingresos Totales (S/)',
                data: valores,
                backgroundColor: 'rgba(54, 162, 235, 0.7)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1.5
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    new Chart(document.getElementById('graficoLinealIngresos').getContext('2d'), {
        type: 'line',
        data: {
            labels: etiquetas,
            datasets: [{
                label: 'Tendencia (S/)',
                data: valores,
                fill: true,
                backgroundColor: 'rgba(40, 167, 69, 0.2)',
                borderColor: 'rgba(40, 167, 69, 1)',
                tension: 0.35
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
    /*]]>*/
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
