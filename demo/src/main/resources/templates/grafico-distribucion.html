<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Distribución - MultiMedia Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- BARRA LATERAL DEDICADA -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- CONTENIDO DEL REPORTE -->
    <main class="flex-grow-1 p-4 overflow-auto" style="height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-0 text-dark"><i class="bi bi-pie-chart-fill text-info me-2"></i>Reporte de Distribución y Participación</h2>
                <small class="text-muted">Gráficos Circulares interactivos (Torta / Rosquilla).</small>
            </div>
            <a th:href="@{/dashboard/ingresos}" class="btn btn-outline-warning btn-sm fw-bold">
                <i class="bi bi-bar-chart-fill me-1"></i>Ver Reporte de Ingresos
            </a>
        </div>

        <div class="row g-4 mb-4">
            <!-- GRÁFICO CIRCULAR 1 -->
            <div class="col-lg-6 col-12">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-pie-chart-fill me-2 text-info"></i>Participación por Formato</span>
                        <select id="selectTipoCirculo" class="form-select form-select-sm" style="width: auto;">
                            <option value="pie">Torta (Pie)</option>
                            <option value="doughnut">Rosquilla (Doughnut)</option>
                        </select>
                    </div>
                    <div class="card-body p-3 text-center">
                        <canvas id="graficoPieFormatos" style="min-height: 280px;"></canvas>
                    </div>
                </div>
            </div>

            <!-- GRÁFICO CIRCULAR 2 -->
            <div class="col-lg-6 col-12">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-check2-circle me-2 text-success"></i>Estado Operativo de las OTs</span>
                        <span class="badge bg-secondary">Doughnut</span>
                    </div>
                    <div class="card-body p-3 text-center">
                        <canvas id="graficoDoughnutEstados" style="min-height: 280px;"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const formatos = /*[[${formatos}]]*/ [];
    const cantidades = /*[[${cantidades}]]*/ [];
    const estados = /*[[${estados}]]*/ [];
    const cantidadesEstados = /*[[${cantidadesEstados}]]*/ [];

    const paletaColores = ['rgba(255, 99, 132, 0.75)', 'rgba(54, 162, 235, 0.75)', 'rgba(255, 206, 86, 0.75)', 'rgba(75, 192, 192, 0.75)'];

    const ctxPie = document.getElementById('graficoPieFormatos').getContext('2d');
    let chartFormatos = new Chart(ctxPie, {
        type: 'pie',
        data: { labels: formatos, datasets: [{ data: cantidades, backgroundColor: paletaColores }] },
        options: { responsive: true, maintainAspectRatio: false }
    });

    document.getElementById('selectTipoCirculo').addEventListener('change', function() {
        chartFormatos.destroy();
        chartFormatos = new Chart(ctxPie, {
            type: this.value,
            data: { labels: formatos, datasets: [{ data: cantidades, backgroundColor: paletaColores }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    });

    new Chart(document.getElementById('graficoDoughnutEstados').getContext('2d'), {
        type: 'doughnut',
        data: {
            labels: estados,
            datasets: [{ data: cantidadesEstados, backgroundColor: ['rgba(13, 110, 253, 0.75)', 'rgba(25, 135, 84, 0.75)', 'rgba(220, 53, 69, 0.75)'] }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
    /*]]>*/
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
